AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dream Slayerz 540 Go API
Resources:
  DreamSlayerzApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - https://dreamslayerz.proudpopsbarbershop.com
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [content-type]
  DreamSlayerzApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dreamslayerz-portal-api
      Runtime: provided.al2023
      Handler: bootstrap
      CodeUri: ../
      Architectures: [arm64]
      Timeout: 10
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DreamSlayerzApi
            Path: /api/{proxy+}
            Method: ANY
Outputs:
  ApiUrl:
    Value: !Sub https://${DreamSlayerzApi}.execute-api.${AWS::Region}.amazonaws.com
